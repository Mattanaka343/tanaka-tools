[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tanaka-tools"
version = "0.1.0"
description = "Data analytics and statistical utilities"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

authors= [
	{name = "Mateo Yanez Tanaka"}
]

dependencies = [
	"numpy",
	"pandas",
	"scipy",
	"matplotlib",
	"seaborn",
	"scikit-learn"
]

[tool.setuptools.packages.find]
where = ["src"]





